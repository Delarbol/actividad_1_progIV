services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: marketsoft
      POSTGRES_PASSWORD: marketsoft
      POSTGRES_DB: marketsoft
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - marketsoft_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketsoft -d marketsoft"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  marketsoft_data:
